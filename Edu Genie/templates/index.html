<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="EduGenie - AI Powered Learning Assistant"
    >

    <title>EduGenie - Learning Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>


<body>


<main class="container">


    <!-- HERO -->

    <header class="hero">

        <div class="badge">
            AI LEARNING ASSISTANT
        </div>

        <h1>
            EduGenie
        </h1>

        <p>
            Learn smarter with AI-powered explanations,
            answers, quizzes, summaries and learning paths.
        </p>

    </header>


    <!-- INPUT CARD -->

    <section class="card">


        <label for="task">
            Choose a task
        </label>


        <select id="task">

            <option value="qa">
                Ask a Question
            </option>

            <option value="explain">
                Explain a Concept
            </option>

            <option value="quiz">
                Generate Quiz
            </option>

            <option value="summarize">
                Summarize
            </option>

            <option value="learn">
                Learning Path
            </option>

        </select>


        <label for="inputText">
            Your input
        </label>


        <textarea
            id="inputText"
            rows="9"
            maxlength="20000"
            placeholder="Example: Explain the Pythagoras theorem to a beginner."
        ></textarea>


        <div class="actions">

            <span id="charCount">
                0 / 20000
            </span>


            <button id="submitBtn">
                Run EduGenie
            </button>

        </div>


    </section>


    <!-- STATUS -->

    <section
        id="status"
        class="status hidden"
    ></section>


    <!-- RESULT -->

    <section class="card result-card">


        <div class="result-heading">

            <h2>
                Result
            </h2>


            <button
                id="copyBtn"
                class="secondary"
                disabled
            >
                Copy
            </button>

        </div>


        <div
            id="result"
            class="result empty"
        >
            Your AI result will appear here.
        </div>


    </section>


    <footer>

        EduGenie • FastAPI + Gemini

    </footer>


</main>


<script
    src="{{ url_for('static', path='app.js') }}"
></script>


</body>

</html>
